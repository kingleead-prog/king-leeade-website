<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>

<title>KING LEEADE | Professional Gospel Guitarist</title>
<style>
:root{--bg:#050914;--panel:#0b1424;--gold:#f2b52f;--gold2:#ffd86b;--white:#f8f9fb;--muted:#aab4c2;--line:#ffffff1c}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif;position:relative;isolation:isolate;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 80% 20%,rgba(242,181,47,.10),transparent 32%),radial-gradient(circle at 15% 80%,rgba(44,98,180,.10),transparent 34%);pointer-events:none}body:after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(3,7,17,.96) 0%,rgba(3,7,17,.88) 38%,rgba(3,7,17,.68) 68%,rgba(3,7,17,.80) 100%),linear-gradient(180deg,rgba(3,7,17,.70),rgba(3,7,17,.90));pointer-events:none}
a{text-decoration:none;color:inherit}.wrap{width:min(94%,1380px);margin:auto}
header{position:fixed;inset:0 0 auto;z-index:50;background:#030711e8;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
nav{height:76px;display:flex;align-items:center;gap:24px;justify-content:flex-end}.logo{width:210px;height:auto;display:block}.nav{margin-left:auto;display:flex;gap:28px;align-items:center}.nav a{font-size:12px;font-weight:800;color:#e9edf2}.nav a:hover{color:var(--gold)}.social{display:flex;gap:8px}.social a{width:31px;height:31px;border-radius:8px;display:grid;place-items:center;background:#ffffff12;border:1px solid #ffffff16;font-weight:900}.menu{display:none;margin-left:auto;width:44px;height:44px;border:1px solid var(--line);background:#0b1424;color:#fff;border-radius:12px;font-size:22px}
.hero{min-height:100svh;position:relative;overflow:hidden;display:flex;align-items:center;background:linear-gradient(90deg,rgba(5,9,20,.64),rgba(5,9,20,.30))}
 .hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 35%,rgba(242,181,47,.14),transparent 30%),linear-gradient(90deg,#030711f5 0%,#050914df 45%,#050914b8 100%);pointer-events:none}
.hero-content{position:relative;z-index:3;padding:135px 0 70px}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:.24em;color:var(--gold)}
h1{font-size:clamp(60px,8.8vw,126px);line-height:.78;letter-spacing:-.065em;margin:17px 0 24px}h1 span{color:var(--gold)}
.hero h2{font-size:clamp(20px,2.5vw,33px);margin:0 0 15px}.hero p{max-width:600px;color:#c0c8d2;line-height:1.75;font-size:15px}
.buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.btn{min-height:50px;padding:0 23px;border-radius:999px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:12px}.primary{background:linear-gradient(180deg,var(--gold2),#e6a21e);color:#07101d;border-color:#ffd86b}.ghost:hover{border-color:var(--gold);color:var(--gold)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);max-width:750px;margin-top:35px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.badge{text-align:center;padding:14px 4px;border-right:1px solid var(--line)}.badge:last-child{border-right:0}.badge b{display:block;color:var(--gold);font-size:20px}.badge strong{display:block;font-size:10px;margin-top:6px}.badge small{display:block;color:#8d98a7;font-size:9px;margin-top:3px}
.section{padding:92px 0;background:rgba(5,9,20,.28)}.head{display:flex;justify-content:space-between;gap:25px;align-items:end;margin-bottom:34px}.kicker{font-size:11px;color:var(--gold);font-weight:900;letter-spacing:.22em}.head h2{font-size:clamp(38px,5vw,68px);line-height:.9;letter-spacing:-.055em;margin:9px 0 0}.head p{max-width:500px;color:var(--muted);line-height:1.7}
.about{display:grid;grid-template-columns:320px 1fr 330px;gap:18px}.box{background:#ffffff06;border:1px solid var(--line);border-radius:18px;overflow:hidden}.portrait{border:2px solid var(--gold)}.portrait img{display:block;width:100%;height:100%;min-height:430px;object-fit:cover;object-position:center}.copy{padding:28px}.copy h3,.services h3{margin:0 0 14px;font-size:26px}.copy p{color:#aeb7c3;line-height:1.75;font-size:14px}.quote{color:var(--gold)!important;font-style:italic}.signature{color:var(--gold);font-family:cursive;font-size:32px}.services{padding:22px}.service-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.service{padding:18px 6px;text-align:center;background:#081321;border:1px solid #ffffff14;border-radius:12px}.service b{display:block;font-size:23px;color:var(--gold)}.service strong{display:block;font-size:10px;line-height:1.35;margin-top:7px}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.gallery .g{position:relative;overflow:hidden;border-radius:14px;border:1px solid #ffffff16;background:#081321}.gallery img{display:block;width:100%;height:320px;object-fit:cover;transition:.35s}.gallery .g:hover img{transform:scale(1.04)}.gallery .label{position:absolute;left:10px;bottom:10px;background:#030711cc;border:1px solid #ffffff1c;border-radius:999px;padding:7px 10px;font-size:9px;font-weight:900}
.pricing{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.price{padding:25px 18px;background:linear-gradient(180deg,#0b1627,#07101d);border:1px solid var(--line);border-radius:16px}.price b{font-size:12px;color:#dbe1e9}.price strong{display:block;font-size:32px;color:var(--gold);margin-top:10px}.price span{display:block;color:#8793a2;font-size:10px;margin-top:7px}
.gear{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.gear-card{padding:22px;text-align:center;border:1px solid var(--line);border-radius:14px;background:#081321}.gear-card b{font-size:25px;color:var(--gold)}.gear-card strong{display:block;margin-top:9px;font-size:11px}
.contact{padding:72px 0;background:linear-gradient(110deg,#0b1526,#07101d);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.contact-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:25px;align-items:center}.contact h2{font-size:clamp(42px,5vw,70px);line-height:.9;letter-spacing:-.05em;margin:10px 0 15px}.contact p{color:#aeb7c2}.contacts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.contact-card{padding:18px;border:1px solid var(--line);border-radius:13px;background:#ffffff06}.contact-card small{display:block;color:#7f8b9a;font-size:9px;text-transform:uppercase;letter-spacing:.13em}.contact-card strong{display:block;margin-top:7px;color:#fff;font-size:13px}.contact-card:hover{border-color:var(--gold)}
footer{background:rgba(3,7,17,.72);padding:32px 0 45px;color:#7f8a99;font-size:10px}footer .wrap{display:flex;justify-content:space-between;gap:20px}.footer-brand{color:#dbe1e9;letter-spacing:.25em}
@media(max-width:980px){.nav,.social{display:none}.menu{display:block}.nav.open{display:flex;position:absolute;top:76px;left:3%;right:3%;flex-direction:column;align-items:stretch;gap:0;padding:8px;background:#07101ff5;border:1px solid var(--line);border-radius:16px}.nav.open a{padding:14px}.hero-person{width:68%;opacity:.75}.about{grid-template-columns:1fr 1fr}.about .services{grid-column:1/-1}.gallery{grid-template-columns:repeat(3,1fr)}.pricing{grid-template-columns:1fr 1fr}.gear{grid-template-columns:1fr 1fr}.contact-grid{grid-template-columns:1fr}}
@media(max-width:600px){nav{height:74px}.logo{width:205px;height:68px}.nav.open{top:68px}.hero{align-items:end}.hero:before{background:linear-gradient(180deg,#050914dd,#0509149c 38%,#050914f7 76%)}.hero-content{padding:260px 0 48px}.hero h1{font-size:clamp(58px,18vw,88px)}.hero p{font-size:13px}.buttons{display:grid;grid-template-columns:1fr}.btn{width:100%}.badges{grid-template-columns:1fr 1fr}.badge:nth-child(2){border-right:0}.badge:nth-child(3),.badge:nth-child(4){border-top:1px solid var(--line)}.section{padding:72px 0}.head{display:block}.head p{margin-top:15px}.about{grid-template-columns:1fr}.about .services{grid-column:auto}.portrait img{min-height:390px}.gallery{grid-template-columns:1fr 1fr}.gallery img{height:250px}.pricing{grid-template-columns:1fr 1fr}.gear{grid-template-columns:1fr 1fr}.contacts{grid-template-columns:1fr}.contact h2{font-size:44px}footer .wrap{display:block;text-align:center}.footer-brand{margin-bottom:12px}}
